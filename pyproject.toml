[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agenteval-studio"
version = "0.5.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Local-first reproducible response contract evaluation; synthetic replay and optional local Ollama."
requires-python = ">=3.12,<3.13"
authors = [{name = "Yerlan Daniel Gómez Hernández"}]
dependencies = ["fastapi==0.162.0", "pydantic==2.14.3", "sqlalchemy==2.1.8", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "httpx2==2.16.0", "build==1.6.1", "hatchling==1.33.0"]

[project.scripts]
agenteval = "agenteval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/agenteval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".venv-clean", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["agenteval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/agenteval"]
